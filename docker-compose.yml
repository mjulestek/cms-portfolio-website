services:
  my-app:
    build: .
    container_name: tech-with-jules-portfolio-cms
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: mongodb://mongodb:27017/jules_portfolio_cms?replicaSet=rs0
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: local-dev-secret-change-me
      ADMIN_EMAIL: mjules.tek@gmail.com
      ADMIN_AUTH_BYPASS: "true"
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      AWS_REGION: us-east-1
      S3_BUCKET_NAME: local-placeholder-bucket
      AWS_ACCESS_KEY_ID: local-placeholder-key
      AWS_SECRET_ACCESS_KEY: local-placeholder-secret
      CLOUDFRONT_DOMAIN: ""
      EMAIL_SERVER: ""
      EMAIL_FROM: noreply@example.com
    depends_on:
      - mongodb
    volumes:
      - .:/app
      - /app/node_modules

  mongodb:
    image: mongo:7
    container_name: jules_portfolio_mongodb
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db

  mongo-compass:
    image: mongo-express:latest
    container_name: jules_portfolio_mongo_compass
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_URL: mongodb://mongodb:27017/?replicaSet=rs0
      ME_CONFIG_BASICAUTH: "false"
    depends_on:
      - mongodb

volumes:
  mongodb_data: