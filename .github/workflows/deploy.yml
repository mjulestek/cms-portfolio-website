# Workflow name shown in GitHub Actions
name: Deploy

# Run this workflow when you push to main
on:
  push:
    branches: [main]

jobs:
  # JOB 1: Build Docker image and push it to Amazon ECR
  build-and-push:
    name: Build and push image to ECR
    runs-on: ubuntu-latest

    steps:
      # Get the project code from GitHub
      - name: Checkout code
        uses: actions/checkout@v4

      # Login GitHub Actions to AWS
      - name: Login to AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      # Login Docker to Amazon ECR
      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      # Build Docker image using Dockerfile, then push it to ECR
      - name: Build and push Docker image
        run: |
          IMAGE="${{ vars.AWS_ACCOUNT_ID }}.dkr.ecr.${{ vars.AWS_REGION }}.amazonaws.com/${{ vars.ECR_REPOSITORY_NAME }}:latest"

          docker build -t "$IMAGE" .
          docker push "$IMAGE"

  # JOB 2: Connect to EC2, pull latest image, and restart app
  deploy-to-ec2:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      # Connect to EC2 with SSH and run deployment commands
      - name: Deploy on EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ vars.EC2_HOST_PUBLIC_ip }}
          username: ${{ vars.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}

          script: |
            # Stop if any command fails

            set -e

            # Create and enter app folder on EC2
            
            mkdir -p "${{ vars.EC2_PROJECT_PATH }}"
            cd "${{ vars.EC2_PROJECT_PATH }}"

            # Login EC2 Docker to Amazon ECR

            aws ecr get-login-password --region "${{ vars.AWS_REGION }}" | docker login --username AWS --password-stdin "${{ vars.AWS_ACCOUNT_ID }}.dkr.ecr.${{ vars.AWS_REGION }}.amazonaws.com"

            # Stop old app if it is running

            docker compose down || true

            # Create production docker-compose.yml on EC2

            cat > docker-compose.yml <<COMPOSE
            services:
              my-app:
                image: "${{ vars.AWS_ACCOUNT_ID }}.dkr.ecr.${{ vars.AWS_REGION }}.amazonaws.com/${{ vars.ECR_REPOSITORY_NAME }}:latest"
                container_name: jules_portfolio_app
                restart: unless-stopped
                ports:
                  - "3000:3000"
                environment:
                  NODE_ENV: "production"
                  DATABASE_URL: "${{ secrets.DATABASE_URL }}"
                  NEXTAUTH_URL: "${{ vars.NEXTAUTH_URL }}"
                  NEXTAUTH_SECRET: "${{ secrets.NEXTAUTH_SECRET }}"
                  NEXT_PUBLIC_SITE_URL: "${{ vars.NEXT_PUBLIC_SITE_URL }}"
                  ADMIN_EMAIL: "${{ vars.ADMIN_EMAIL }}"
                  ADMIN_AUTH_BYPASS: "${{ vars.ADMIN_AUTH_BYPASS }}"
                  EMAIL_SERVER: "${{ secrets.EMAIL_SERVER }}"
                  EMAIL_FROM: "${{ vars.EMAIL_FROM }}"
                  AWS_REGION: "${{ vars.AWS_REGION }}"
                  S3_BUCKET_NAME: "${{ vars.S3_BUCKET_NAME }}"
                  AWS_ACCESS_KEY_ID: "${{ secrets.AWS_ACCESS_KEY_ID }}"
                  AWS_SECRET_ACCESS_KEY: "${{ secrets.AWS_SECRET_ACCESS_KEY }}"
                  CLOUDFRONT_DOMAIN: "${{ vars.CLOUDFRONT_DOMAIN }}"
            COMPOSE

            # Remove old unused Docker data to save EC2 disk space

            docker image prune -a -f || true
            docker builder prune -f || true

            # Pull newest image from ECR

            docker compose pull

            # Start app

            docker compose up -d

            # Sync Prisma schema with MongoDB Atlas

            # docker compose exec -T my-app npx prisma db push